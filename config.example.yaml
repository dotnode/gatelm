# =============================================================================
# GateLM 配置示例
# 复制此文件为 config.yaml 并根据实际环境修改
# =============================================================================

# ----- 基础设置 -----

# 监听地址，示例使用不常用端口 :18765
listen: ":18765"

# 启用 debug 日志，日志写入 logs/debug-YYYY-MM-DD.log，按日期自动滚动
debug: false

# 最大并发请求数，0 = 不限制（默认）
# 超限时返回 503
max_concurrent_requests: 0

# ----- 模型默认参数 -----
# 按后端模型名配置，优先级高于 backends[].models[] 中的同名字段
# 支持 "模型名@客户端协议" 格式实现协议维度覆盖
# 例如 "gpt-4o@anthropic" 仅在 Anthropic 客户端访问时生效
model_defaults:
  # 示例：为 gpt-4o 配置默认参数
  gpt-4o:
    # 推理强度：low / medium / high / xhigh
    reasoning_effort: high

    # 客户端未指定 max_tokens 时注入此值
    max_tokens: 16384

    # 客户端未指定 temperature 时注入此值（范围 0~2）
    default_temperature: 0.6

    # 模型级 system prompt
    # 设为 "none" 可显式阻止注入（区别于空字符串 = 未设置）
    # system_prompt: "你是工程助手，先给结论再给说明。"

    # 将 xhigh 降级为 high，兼容仅支持 low/medium/high 的上游
    # normalize_xhigh_reasoning_effort: true

  # 协议维度覆盖示例：
  # gpt-4o@anthropic:
  #   system_prompt: "Anthropic 客户端专用提示词"
  # gpt-4o@openai:
  #   system_prompt: "none"    # OpenAI 客户端直连时不注入

# ----- 熔断器配置 -----
circuit_breaker:
  # 连续失败多少次触发熔断（默认 1）
  fail_threshold: 3

  # 熔断冷却窗口（默认 30s）
  recovery_timeout: "30s"

  # probing 状态允许的探测请求数（默认 1）
  half_open_max_requests: 1

# ----- Token 用量日志 -----
token_log:
  enabled: true

  # 文件后缀决定存储模式：
  #   .db / .sqlite / .sqlite3 → SQLite（推荐，支持结构化查询）
  #   .log / .jsonl            → JSONL（向后兼容）
  file: "token_usage.db"

  # 自动清理 N 天前的记录，0 = 不清理
  retention_days: 90

# ----- 客户端 API Key 映射（可选） -----
# 将客户端 key 映射为可读的业务名称，用于日志和统计
# 未映射的 key 会以掩码 + SHA256 哈希显示
api_keys:
  sk-your-client-key-here: "user-alice"
  sk-another-key: "user-bob"

# ----- 管理台（Web Console） -----
console:
  enabled: true

  # 登录密码，支持 ${ENV_VAR} 语法引用环境变量
  # 示例：password: "${CONSOLE_PASSWORD}"
  password: "your-password-here"

# ----- 后端配置 -----
# GateLM 核心：定义上游 API 后端
# 每个后端包含 URL、协议、认证信息和模型列表
# 同一个模型别名可出现在多个后端中，实现多后端容错
backends:

  # ===== 示例 1：基础单后端 =====
  - name: my-openai
    url: "https://api.openai.com"

    # 后端协议：openai / anthropic / openai-responses
    # openai          → /v1/chat/completions
    # anthropic       → /v1/messages
    # openai-responses → /v1/responses
    protocol: "openai"

    # 请求头，通常用于认证
    headers:
      Authorization: "Bearer sk-your-api-key"

    # 模型列表
    models:
      - name: gpt-4o                 # 后端实际接受的模型名
        aliases:                      # 客户端可以用这些别名访问
          - claude-sonnet-4
          - sonnet

        # 客户端未指定 max_tokens 时注入（0 = 不注入）
        # default_max_tokens: 8192

        # 客户端未指定 temperature 时注入
        # default_temperature: 0.6

        # 模型级推理强度覆盖（低于 model_defaults）
        # reasoning_default_effort: high

        # 模型级 system prompt（优先于 model_defaults 和全局）
        # system_prompt: "专用于此模型的提示词"

  # ===== 示例 2：OpenAI Responses API 后端 =====
  # - name: my-responses
  #   url: "https://api.openai.com"
  #   protocol: "openai-responses"    # 使用 /v1/responses 端点
  #
  #   # WS 客户端直接走 HTTP SSE，跳过 WS 拨号
  #   # 适用于不支持 WebSocket 的后端
  #   sse_only: true
  #
  #   headers:
  #     Authorization: "Bearer sk-your-api-key"
  #   models:
  #     - name: gpt-4o
  #       aliases: [claude-sonnet-4]
  #       default_max_tokens: 16384

  # ===== 示例 3：多后端容错 + 负载均衡 =====
  # 同一个 alias 配置在多个后端，按优先级自动降级

  # - name: primary
  #   url: "https://primary-api.example.com"
  #   protocol: "openai"
  #   priority: 1                     # 数字越小优先级越高（默认 0）
  #   weight: 3                       # 同优先级内的权重比例（默认 1）
  #   timeout: "90s"                  # 单后端请求超时（可选）
  #
  #   # 主动健康检查（可选）
  #   health_check:
  #     path: "/healthz"              # 检查路径，默认 /healthz
  #     interval: "10s"               # 检查间隔
  #
  #   headers:
  #     Authorization: "Bearer sk-primary-key"
  #   models:
  #     - name: gpt-4o
  #       aliases: [claude-sonnet-4]

  # - name: secondary
  #   url: "https://secondary-api.example.com"
  #   protocol: "openai"
  #   priority: 2                     # 较低优先级，primary 不可用时自动降级
  #   weight: 1
  #   headers:
  #     Authorization: "Bearer sk-secondary-key"
  #   models:
  #     - name: gpt-4o
  #       aliases: [claude-sonnet-4]  # 同一 alias，实现自动容错

  # ===== 示例 4：默认后端（透传未匹配的模型） =====
  # - name: catch-all
  #   url: "https://api.openai.com"
  #   protocol: "openai"
  #   default: true                   # 只能有一个 default 后端
  #   headers:
  #     Authorization: "Bearer sk-your-key"
  #   models:
  #     - name: gpt-4o
  #       aliases: [gpt4]

  # ===== 示例 5：路径前缀路由（可选） =====
  # 通过 URL 路径前缀匹配后端，优先级高于模型索引路由
  # - name: legacy-openai
  #   url: "https://api.openai.com"
  #   protocol: "openai"
  #   path_prefix: "/openai"          # 匹配 /openai/* 的请求
  #   strip_prefix: true              # 转发时去掉 /openai 前缀
  #   headers:
  #     Authorization: "Bearer sk-your-key"
  #   models:
  #     - name: gpt-4o

# =============================================================================
# 使用说明
# =============================================================================
#
# 1. 快速开始：
#    cp config.example.yaml config.yaml
#    # 编辑 config.yaml，填入你的后端 URL 和 API Key
#    go build -o gatelm ./cmd/gatelm/
#    ./gatelm -config config.yaml
#
# 2. 客户端协议自动检测：
#    GateLM 根据请求路径自动判断客户端协议，无需额外配置：
#    - /v1/chat/completions  → OpenAI
#    - /v1/responses         → OpenAI Responses
#    - /v1/messages          → Anthropic
#
# 3. 协议自动转换：
#    Anthropic 客户端 → OpenAI 后端，自动完成请求/响应协议转换
#    包括流式 SSE、tool use、thinking/reasoning 双向转换
#
# 4. 模型别名路由：
#    客户端使用 aliases 中的名字（如 claude-sonnet-4），
#    GateLM 自动路由到对应后端并替换为实际模型名（如 gpt-4o）
#
# 5. 多后端容错：
#    同一个 alias 配置在多个后端（不同 priority），
#    高优先级后端不可用时自动降级到低优先级后端
#
# 6. 管理台：
#    启用 console 后访问 http://your-host:port/console
#    支持配置管理、日志查询、健康状态监控、在线测试
#
# 7. 监控端点：
#    GET /healthz          → 健康检查（始终返回 200）
#    GET /healthz/detail   → 后端详情（所有后端熔断时返回 503）
#    GET /metrics          → Prometheus 指标
